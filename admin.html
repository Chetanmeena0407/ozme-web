<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
</head>
<body>

<h2>Add Chapter</h2>
<input id="chapterName" placeholder="Chapter Name">
<button onclick="addChapter()">Add Chapter</button>

<h2>Add Type</h2>
<input id="typeName" placeholder="Type (PYQ/NCERT)">
<input id="chapterId" placeholder="Chapter ID">
<button onclick="addType()">Add Type</button>

<h2>Add Question</h2>
<input id="question" placeholder="Question"><br>
<input id="opt1" placeholder="Option 1"><br>
<input id="opt2" placeholder="Option 2"><br>
<input id="opt3" placeholder="Option 3"><br>
<input id="opt4" placeholder="Option 4"><br>
<input id="answer" placeholder="Correct Answer"><br>
<input id="image" placeholder="Image URL"><br>
<input id="typeId" placeholder="Type ID"><br>

<button onclick="addQuestion()">Add Question</button>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="firebase.js"></script>

<script>

function addChapter() {
  db.collection("chapters").add({
    subject: "botany",
    name: chapterName.value
  });
}

function addType() {
  db.collection("types").add({
    chapterId: chapterId.value,
    name: typeName.value
  });
}

function addQuestion() {
  db.collection("questions").add({
    question: question.value,
    options: [opt1.value, opt2.value, opt3.value, opt4.value],
    answer: answer.value,
    image: image.value,
    typeId: typeId.value
  });
}

</script>

</body>
</html>
