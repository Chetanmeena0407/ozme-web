<!DOCTYPE html>
<html>
<head>
  <title>Login - MCQ App</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      display: flex;
      width: 800px;
      height: 450px;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .left {
      flex: 1;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .right {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    input {
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background: #4facfe;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .secondary {
      background: #eee;
      color: #333;
    }

    #msg {
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="left">
    <h1>MCQ Practice</h1>
    <p>Prepare smarter with daily tests 🚀</p>
  </div>

  <div class="right">
    <h2>Login / Signup</h2>

    <input id="email" placeholder="Enter Email">
    <input id="password" type="password" placeholder="Enter Password">

    <button onclick="login()">Login</button>
    <button class="secondary" onclick="signup()">Create Account</button>

    <p id="msg"></p>
  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script src="firebase.js"></script>

<script>
const msg = document.getElementById("msg");

// 🔥 SIGNUP (FIXED)
function signup() {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  firebase.auth().createUserWithEmailAndPassword(email, pass)
    .then((userCred) => {

      // 🔥 SAVE TO FIRESTORE
      return db.collection("users").doc(userCred.user.uid).set({
        email: email,
        isPremium: false
      });

    })
    .then(() => {
      msg.style.color = "green";
      msg.innerText = "Account Created + Saved ✅";
    })
    .catch(err => {
      msg.style.color = "red";
      msg.innerText = err.message;
      console.log(err);
    });
}

// 🔐 LOGIN
function login() {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  firebase.auth().signInWithEmailAndPassword(email, pass)
    .then(() => {
      msg.style.color = "green";
      msg.innerText = "Login Success ✅";

      setTimeout(() => {
        window.location.href = "index.html";
      }, 1000);
    })
    .catch(err => {
      msg.style.color = "red";
      msg.innerText = err.message;
    });
}
</script>

</body>
</html>
