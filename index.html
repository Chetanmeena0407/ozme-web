<!DOCTYPE html>
<html>
<head>
  <title>MCQ App</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    button {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      background: #4facfe;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>MCQ Dashboard</h2>

<button onclick="logout()">Logout</button>

<div class="card">
  <h3 id="userEmail">Loading...</h3>
  <p>Progress: <span id="progress">0</span>/100</p>
</div>

<div class="card">
  <button onclick="startTest()">Start MCQ</button>
</div>

<div id="quiz" class="card"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script src="firebase.js"></script>

<script>
let questions = [];
let current = 0;

// 🔐 Login check
firebase.auth().onAuthStateChanged(function(user) {
  if (!user) {
    window.location.href = "login.html";
  } else {
    document.getElementById("userEmail").innerText = user.email;
    loadProgress();
  }
});

// 📊 Progress load
function loadProgress() {
  let data = JSON.parse(localStorage.getItem("progress")) || {
    date: new Date().toDateString(),
    done: []
  };

  let today = new Date().toDateString();

  if (data.date !== today) {
    data = { date: today, done: [] };
    localStorage.setItem("progress", JSON.stringify(data));
  }

  document.getElementById("progress").innerText = data.done.length;
}

// 🚀 Start test
function startTest() {
  db.collection("questions").get().then(snapshot => {
    questions = [];
    snapshot.forEach(doc => {
      questions.push(doc.data());
    });

    current = 0;
    showQuestion();
  });
}

// 📚 Show question
function showQuestion() {
  let q = questions[current];

  document.getElementById("quiz").innerHTML = `
    <h3>${q.question}</h3>
    ${q.options.map(opt =>
      `<button onclick="answer('${opt}')">${opt}</button>`
    ).join("<br><br>")}
  `;
}

// 🔥 Progress update
function updateProgress(index) {
  let data = JSON.parse(localStorage.getItem("progress")) || {
    date: new Date().toDateString(),
    done: []
  };

  let today = new Date().toDateString();

  if (data.date !== today) {
    data = { date: today, done: [] };
  }

  if (data.done.includes(index)) {
    data.done = []; // repeat → reset
  } else {
    data.done.push(index);
  }

  localStorage.setItem("progress", JSON.stringify(data));
}

// ✅ Answer
function answer(opt) {
  updateProgress(current);
  loadProgress();

  current++;

  if (current < questions.length) {
    showQuestion();
  } else {
    document.getElementById("quiz").innerHTML =
      "<h2>Test Finished ✅</h2>";
  }
}

// 🚪 Logout
function logout() {
  firebase.auth().signOut().then(() => {
    window.location.href = "login.html";
  });
}
</script>

</body>
</html>
